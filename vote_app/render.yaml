# Render 一键部署蓝图（适配 vote_app/ 子目录结构）
services:
  - type: web
    name: gift-vote
    runtime: python
    plan: free
    region: oregon
    branch: main
    buildCommand: pip install -r vote_app/requirements.txt
    startCommand: python vote_app/vote_app.py
    healthCheckPath: /
    envVars:
      - key: PYTHON_VERSION
        value: "3.13"
      - key: DATABASE_URL
        fromDatabase:
          name: gift-vote-db
          property: connectionString

databases:
  - name: gift-vote-db
    databaseName: vote
    user: vote
    plan: free
    postgresMajorVersion: "16"
